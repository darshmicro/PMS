<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Performance — Performance Management System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/pms.css">
<style>
  .pms-header-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .pms-header-sub { font-size: 13px; color: var(--pms-text-muted); margin-bottom: 24px; }
  .pms-record-card { margin-bottom: 18px; }
  .pms-record-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .pms-record-title { font-size: 15px; font-weight: 700; }
  .pms-score-row { display: flex; gap: 20px; flex-wrap: wrap; margin: 14px 0; }
  .pms-score-box { flex: 1; min-width: 150px; }
  .pms-score-box-label { font-size: 11px; color: var(--pms-text-label); font-weight: 700; letter-spacing: .03em; }
  .pms-score-box-value { font-family: 'Manrope', sans-serif; font-size: 20px; font-weight: 700; margin-top: 6px; }
  .pms-transition-item { display: flex; gap: 12px; padding-bottom: 16px; }
  .pms-transition-item:last-child { padding-bottom: 0; }
  .pms-transition-dotcol { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<div class="pms-shell">
  <div class="pms-sidebar" data-pms-sidebar></div>

  <div class="pms-main">
    <div class="pms-topbar">
      <div style="font-size:13px;font-weight:600;color:var(--pms-text-soft);">My Performance</div>
      <div style="display:flex;align-items:center;gap:16px;" data-pms-topbar-user></div>
    </div>

    <div class="pms-content">
      <div class="pms-header-title">My Performance</div>
      <div class="pms-header-sub">Your appraisal cycles, scores and approval history.</div>

      <div id="pms-loading">
        <div class="pms-skeleton" style="height:180px;margin-bottom:16px;"></div>
        <div class="pms-skeleton" style="height:180px;"></div>
      </div>

      <div id="pms-error" class="pms-error pms-hide"></div>
      <div id="pms-empty" class="pms-empty pms-hide">No performance records found for you yet.</div>
      <div id="pms-records" class="pms-hide"></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/roles.js"></script>
<script src="js/my-performance.js"></script>
</body>
</html>
