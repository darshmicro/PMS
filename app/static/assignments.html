<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPA / KPI Assignment — Performance Management System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/pms.css">
<style>
  .pms-header-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 14px; }
  .pms-header-title { font-size: 22px; font-weight: 700; }
  .pms-header-sub { font-size: 13px; color: var(--pms-text-muted); margin-top: 4px; }
  .pms-record-card { margin-bottom: 16px; }
  .pms-record-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 10px; }
  .pms-record-title { font-size: 15px; font-weight: 700; }
  .pms-record-sub { font-size: 12px; color: var(--pms-text-faint); margin-top: 2px; }
</style>
</head>
<body>

<div class="pms-shell">
  <div class="pms-sidebar" data-pms-sidebar></div>

  <div class="pms-main">
    <div class="pms-topbar">
      <div style="font-size:13px;font-weight:600;color:var(--pms-text-soft);">KPA / KPI Assignment</div>
      <div style="display:flex;align-items:center;gap:16px;" data-pms-topbar-user></div>
    </div>

    <div class="pms-content">
      <div class="pms-header-row">
        <div>
          <div class="pms-header-title">KPA / KPI Assignment</div>
          <div class="pms-header-sub" id="pms-header-sub">Set annual KPAs and KPIs for the appraisal cycle.</div>
        </div>
        <button class="pms-btn-primary pms-hide" id="pms-new-btn">+ New Assignment</button>
      </div>

      <div class="pms-card pms-hide" id="pms-new-form" style="margin-bottom:22px;">
        <div class="pms-section-title" style="font-size:14px;font-weight:700;margin-bottom:4px;">New Assignment</div>
        <div class="pms-form-grid">
          <div id="pms-employee-field">
            <label class="pms-label">Employee</label>
            <select class="pms-field" id="pms-new-employee"></select>
          </div>
          <div>
            <label class="pms-label">Performance Cycle</label>
            <select class="pms-field" id="pms-new-cycle"></select>
          </div>
        </div>
        <div class="pms-form-actions">
          <button class="pms-btn-primary" id="pms-new-create">Create</button>
          <button class="pms-btn-ghost" id="pms-new-cancel">Cancel</button>
        </div>
        <div class="pms-inline-note pms-hide" id="pms-new-error"></div>
      </div>

      <div id="pms-loading">
        <div class="pms-skeleton" style="height:120px;margin-bottom:16px;"></div>
        <div class="pms-skeleton" style="height:120px;"></div>
      </div>

      <div id="pms-error" class="pms-error pms-hide"></div>
      <div id="pms-empty" class="pms-empty pms-hide">No KPA/KPI assignments found in your scope yet.</div>
      <div id="pms-records" class="pms-hide"></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/roles.js"></script>
<script src="js/assignments.js"></script>
</body>
</html>
